blueprint:
  name: Pool-Manager
  description: >
    Vollständige Poolpumpen-Steuerung.


    ⚡ **DIREKT NUTZBAR:**

    Einfach den Pumpen-Schalter auswählen, fertig!


    🔧 **OPTIONALE HELPER (für Dashboard):**

    Lege folgende Helper an und wähle sie unten aus:

    - `input_boolean.pool_bath_pause_active` – Badepause-Status

    - `input_number.pool_bath_pause_remaining` – Badepause-Restzeit (0-480, Schritt 1)

    - `input_number.pool_manual_runtime_remaining` – Manuelle Filter-Restzeit (0-600, Schritt 1)


    ℹ️ **HINWEIS:**

    Wenn kein Temperatur-Sensor angegeben ist, wird von 20°C ausgegangen.

  domain: automation
  source_url: https://github.com/zu3st-de/Pool-Manager

  input:
    pump_switch:
      name: Pumpen-Schalter
      description: Der Schalter für die Poolpumpe
      selector:
        entity:
          domain: switch

    pool_volume:
      name: Poolvolumen (Liter)
      description: Gesamtvolumen des Pools in Litern
      default: 50000
      selector:
        number:
          min: 1000
          max: 1000000
          unit_of_measurement: L

    pump_flow_rate:
      name: Pumpendurchsatz (L/h)
      description: Durchsatz der Poolpumpe in Litern pro Stunde
      default: 10000
      selector:
        number:
          min: 100
          max: 100000
          unit_of_measurement: L/h

    # === ZEITFENSTER PRO WOCHENTAG ===
    monday_start:
      name: Montag - Startzeit
      selector:
        time:
      default: "06:00:00"

    monday_end:
      name: Montag - Endzeit
      selector:
        time:
      default: "22:00:00"

    tuesday_start:
      name: Dienstag - Startzeit
      selector:
        time:
      default: "06:00:00"

    tuesday_end:
      name: Dienstag - Endzeit
      selector:
        time:
      default: "22:00:00"

    wednesday_start:
      name: Mittwoch - Startzeit
      selector:
        time:
      default: "06:00:00"

    wednesday_end:
      name: Mittwoch - Endzeit
      selector:
        time:
      default: "22:00:00"

    thursday_start:
      name: Donnerstag - Startzeit
      selector:
        time:
      default: "06:00:00"

    thursday_end:
      name: Donnerstag - Endzeit
      selector:
        time:
      default: "22:00:00"

    friday_start:
      name: Freitag - Startzeit
      selector:
        time:
      default: "06:00:00"

    friday_end:
      name: Freitag - Endzeit
      selector:
        time:
      default: "22:00:00"

    saturday_start:
      name: Samstag - Startzeit
      selector:
        time:
      default: "05:00:00"

    saturday_end:
      name: Samstag - Endzeit
      selector:
        time:
      default: "23:00:00"

    sunday_start:
      name: Sonntag - Startzeit
      selector:
        time:
      default: "05:00:00"

    sunday_end:
      name: Sonntag - Endzeit
      selector:
        time:
      default: "23:00:00"

    # === BADEPAUSE ===
    bath_pause_duration:
      name: Badepause-Dauer (Minuten)
      description: Wie lange die Pumpe aus bleibt, wenn man sie manuell ausschaltet
      default: 60
      selector:
        number:
          min: 5
          max: 480
          step: 5
          unit_of_measurement: min

    # === MANUELLE FILTERUNG ===
    manual_filter_duration:
      name: Manuelle Filter-Dauer (Minuten)
      description: Wie lange die Pumpe läuft, wenn man sie manuell einschaltet (außerhalb Zeitfenster)
      default: 240
      selector:
        number:
          min: 10
          max: 600
          step: 10
          unit_of_measurement: min

    # === OPTIONALE SENSOREN ===
    temperature_sensor:
      name: Wassertemperatur-Sensor (optional)
      description: "Wird keiner angegeben, wird von 20°C ausgegangen"
      default: ""
      selector:
        entity:
          domain: sensor

    pv_sensor:
      name: PV-Überschuss-Sensor (optional)
      description: "Sensor für verfügbaren PV-Überschuss in Watt"
      default: ""
      selector:
        entity:
          domain: sensor

    pv_threshold:
      name: PV-Überschuss Schwellwert (Watt)
      description: Ab dieser Leistung wird die Pumpe zusätzlich eingeschaltet
      default: 2000
      selector:
        number:
          min: 0
          max: 50000
          step: 100
          unit_of_measurement: W

    pv_max_additional_minutes:
      name: Maximale zusätzliche Filterung bei PV (Minuten)
      description: Wie lange die Pumpe maximal zusätzlich läuft, wenn PV-Überschuss vorhanden ist
      default: 120
      selector:
        number:
          min: 0
          max: 600
          step: 10
          unit_of_measurement: min

    # === OPTIONALE HELPER FÜR DASHBOARD ===
    bath_pause_active_entity:
      name: Badepause-Aktiv (input_boolean, optional)
      description: "Helper für Dashboard: input_boolean.pool_bath_pause_active"
      default: ""
      selector:
        entity:
          domain: input_boolean

    bath_pause_remaining_entity:
      name: Badepause-Restzeit (input_number, optional)
      description: "Helper für Dashboard: input_number.pool_bath_pause_remaining (0-480)"
      default: ""
      selector:
        entity:
          domain: input_number

    manual_runtime_remaining_entity:
      name: Manuelle Filter-Restzeit (input_number, optional)
      description: "Helper für Dashboard: input_number.pool_manual_runtime_remaining (0-600)"
      default: ""
      selector:
        entity:
          domain: input_number

variables:
  pump_switch: !input pump_switch
  pool_volume: !input pool_volume
  pump_flow: !input pump_flow_rate
  temp_sensor: !input temperature_sensor
  bath_duration: !input bath_pause_duration
  filter_duration: !input manual_filter_duration
  pv_sensor: !input pv_sensor
  pv_threshold: !input pv_threshold
  pv_max_minutes: !input pv_max_additional_minutes
  bath_active_entity: !input bath_pause_active_entity
  bath_remaining_entity: !input bath_pause_remaining_entity
  manual_remaining_entity: !input manual_runtime_remaining_entity

  # === TEMPERATUR & BUDGET-BERECHNUNG ===
  # Aktuelle Temperatur (mit Fallback 20°C bei fehlendem/unkown Sensor)
  water_temp: >
    {% if temp_sensor != '' and states(temp_sensor) not in ['unknown', 'unavailable'] %}
      {{ states(temp_sensor) | float(20) }}
    {% else %}
      20
    {% endif %}

  # Empfohlene Umwälzungen pro Tag basierend auf Temperatur
  # < 15°C: 1,0×  |  15-20°C: 1,5×  |  20-24°C: 2×  |  24-28°C: 2,5×  |  > 28°C: 3×
  umwaelzungen: >
    {% set t = water_temp | float %}
    {% if t < 15 %}
      1.0
    {% elif t <= 20 %}
      1.5
    {% elif t <= 24 %}
      2.0
    {% elif t <= 28 %}
      2.5
    {% else %}
      3.0
    {% endif %}

  # Benötigte Laufzeit in Minuten (Budget)
  budget_minuten: >
    {{ ((umwaelzungen | float) * pool_volume / pump_flow * 60) | round(0) | int }}

  # Ist die Badepause aktiv? (über Helper)
  bath_pause_active: >
    {% if bath_active_entity != '' %}
      {{ is_state(bath_active_entity, 'on') }}
    {% else %}
      false
    {% endif %}

trigger:
  # Zeitfenster-Start (pro Wochentag)
  - platform: time
    at: !input monday_start
    id: "monday_start"
  - platform: time
    at: !input monday_end
    id: "monday_end"
  - platform: time
    at: !input tuesday_start
    id: "tuesday_start"
  - platform: time
    at: !input tuesday_end
    id: "tuesday_end"
  - platform: time
    at: !input wednesday_start
    id: "wednesday_start"
  - platform: time
    at: !input wednesday_end
    id: "wednesday_end"
  - platform: time
    at: !input thursday_start
    id: "thursday_start"
  - platform: time
    at: !input thursday_end
    id: "thursday_end"
  - platform: time
    at: !input friday_start
    id: "friday_start"
  - platform: time
    at: !input friday_end
    id: "friday_end"
  - platform: time
    at: !input saturday_start
    id: "saturday_start"
  - platform: time
    at: !input saturday_end
    id: "saturday_end"
  - platform: time
    at: !input sunday_start
    id: "sunday_start"
  - platform: time
    at: !input sunday_end
    id: "sunday_end"

  # Pumpe manuell ausgeschaltet (Badepause)
  - platform: state
    entity_id: !input pump_switch
    to: "off"
    id: "pump_turned_off"

  # Pumpe manuell eingeschaltet (manuelle Filterung)
  - platform: state
    entity_id: !input pump_switch
    to: "on"
    id: "pump_turned_on"

  # PV-Überschuss-Änderung (mit 5 Minuten Verzögerung gegen Toggeln)
  - platform: state
    entity_id: !input pv_sensor
    id: "pv_above_threshold"
    for:
      minutes: 5

condition: []

action:
  - variables:
      # Prüfen ob die Automation die Pumpe gesteuert hat oder der Benutzer
      was_automated: >
        {{ trigger.from_state is defined and
           trigger.from_state.context is defined and
           trigger.from_state.context.user_id is none }}

  - choose:
      # === BADEPAUSE: Pumpe manuell ausgeschaltet ===
      - conditions:
          - condition: trigger
            id: "pump_turned_off"
        sequence:
          - if:
              - condition: template
                value_template: "{{ not was_automated }}"
            then:
              # Badepause aktivieren
              - if:
                  - condition: template
                    value_template: "{{ bath_active_entity != '' }}"
                then:
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ bath_active_entity }}"
              - if:
                  - condition: template
                    value_template: "{{ bath_remaining_entity != '' }}"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: "{{ bath_remaining_entity }}"
                    data:
                      value: "{{ bath_duration }}"

              # Warten (Badepause)
              - delay:
                  minutes: "{{ bath_duration }}"

              # Nach Badepause: Pumpe wieder anschalten
              - if:
                  - condition: template
                    value_template: "{{ is_state(pump_switch, 'off') }}"
                then:
                  - service: switch.turn_on
                    target:
                      entity_id: "{{ pump_switch }}"

              # Badepause deaktivieren
              - if:
                  - condition: template
                    value_template: "{{ bath_active_entity != '' }}"
                then:
                  - service: input_boolean.turn_off
                    target:
                      entity_id: "{{ bath_active_entity }}"
              - if:
                  - condition: template
                    value_template: "{{ bath_remaining_entity != '' }}"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: "{{ bath_remaining_entity }}"
                    data:
                      value: 0

      # === MANUELLE FILTERUNG: Pumpe manuell eingeschaltet ===
      - conditions:
          - condition: trigger
            id: "pump_turned_on"
        sequence:
          - if:
              - condition: template
                value_template: "{{ not was_automated }}"
            then:
              # Helper aktualisieren (optional)
              - if:
                  - condition: template
                    value_template: "{{ manual_remaining_entity != '' }}"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: "{{ manual_remaining_entity }}"
                    data:
                      value: "{{ filter_duration }}"

              # Warten (manuelle Filterung)
              - delay:
                  minutes: "{{ filter_duration }}"

              # Nach Filterung: Pumpe aus
              - if:
                  - condition: template
                    value_template: "{{ is_state(pump_switch, 'on') }}"
                then:
                  - service: switch.turn_off
                    target:
                      entity_id: "{{ pump_switch }}"

              - if:
                  - condition: template
                    value_template: "{{ manual_remaining_entity != '' }}"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: "{{ manual_remaining_entity }}"
                    data:
                      value: 0

      # === ZEITFENSTER START: Temperatur messen, Budget berechnen, Pumpe an ===
      - conditions:
          - condition: trigger
            id:
              - "monday_start"
              - "tuesday_start"
              - "wednesday_start"
              - "thursday_start"
              - "friday_start"
              - "saturday_start"
              - "sunday_start"
        sequence:
          # Wochentag prüfen
          - condition: template
            value_template: >
              {% set day_map = {'monday':0,'tuesday':1,'wednesday':2,'thursday':3,'friday':4,'saturday':5,'sunday':6} %}
              {% set trigger_id = trigger.id %}
              {% set trigger_day = trigger_id.split('_')[0] %}
              {{ day_map[trigger_day] == now().weekday() }}
          # Keine Badepause aktiv
          - condition: template
            value_template: "{{ not bath_pause_active }}"

          # Temperatur-Warnung (wenn kein Sensor)
          - if:
              - condition: template
                value_template: "{{ temp_sensor == '' }}"
            then:
              - service: notify.persistent_notification
                data:
                  title: "🌡️ Pool-Manager: Kein Temperatursensor"
                  message: >
                    Es wurde kein Temperatursensor konfiguriert.
                    Es wird von 20°C Wassertemperatur ausgegangen.
                    Für optimale Filterung bitte einen Temperatur-Sensor angeben.

          # Pumpe einschalten
          - service: switch.turn_on
            target:
              entity_id: "{{ pump_switch }}"

          # Budget-Zeit abwarten (Pumpe läuft für berechnete Dauer)
          - delay:
              minutes: "{{ budget_minuten }}"

          # Nach Budget-Ende: Pumpe aus, sofern Zeitfenster noch nicht zu Ende ist
          - if:
              - condition: template
                value_template: "{{ is_state(pump_switch, 'on') }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: "{{ pump_switch }}"

      # === ZEITFENSTER ENDE: Pumpe aus ===
      - conditions:
          - condition: trigger
            id:
              - "monday_end"
              - "tuesday_end"
              - "wednesday_end"
              - "thursday_end"
              - "friday_end"
              - "saturday_end"
              - "sunday_end"
        sequence:
          # Wochentag prüfen
          - condition: template
            value_template: >
              {% set day_map = {'monday':0,'tuesday':1,'wednesday':2,'thursday':3,'friday':4,'saturday':5,'sunday':6} %}
              {% set trigger_id = trigger.id %}
              {% set trigger_day = trigger_id.split('_')[0] %}
              {{ day_map[trigger_day] == now().weekday() }}
          # Nur ausschalten, wenn keine Badepause aktiv
          - condition: template
            value_template: "{{ not bath_pause_active }}"
          - service: switch.turn_off
            target:
              entity_id: "{{ pump_switch }}"

      # === PV-ÜBERSCHUSS: Nur nach Budget-Ende, innerhalb Zeitfenster ===
      - conditions:
          - condition: trigger
            id: "pv_above_threshold"
        sequence:
          # Prüfen: Pumpe aktuell aus? (Budget ist aufgebraucht)
          - condition: template
            value_template: "{{ is_state(pump_switch, 'off') }}"
          # Nicht in Badepause
          - condition: template
            value_template: "{{ not bath_pause_active }}"
          # PV-Überschuss vorhanden
          - condition: template
            value_template: >
              {{ pv_sensor != '' and states(pv_sensor) not in ['unknown', 'unavailable'] and
                 states(pv_sensor) | float(0) >= pv_threshold }}

          # Pumpe einschalten (PV-Überschuss)
          - service: switch.turn_on
            target:
              entity_id: "{{ pump_switch }}"

          # PV-Zusatzfilterung (maximal pv_max_minutes)
          - delay:
              minutes: "{{ pv_max_minutes }}"

          # Nach PV-Filterung: Pumpe aus
          - if:
              - condition: template
                value_template: "{{ is_state(pump_switch, 'on') }}"
            then:
              - service: switch.turn_off
                target:
                  entity_id: "{{ pump_switch }}"
