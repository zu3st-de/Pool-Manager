blueprint:
  name: Pool Chemie-Management (Chlor & PH)
  description: >
    Optionale Automation für Poolchemie-Überwachung mit Empfehlungen:
    - Chlor-Wert-Überwachung mit Zugabe-Empfehlungen
    - PH-Wert-Überwachung mit PH-Minus/Plus-Empfehlungen
    - Multitab-Öffnung-Empfehlungen
    - Benachrichtigungen bei Abweichungen
  domain: automation
  source_url: https://github.com/your-repo/pool-manager/blob/main/blueprints/pool_chemistry_automation.yaml

  input:
    # ==== CHLOR-SENSOREN ====
    chlorine_sensor_enabled:
      name: Chlor-Sensor aktivieren
      default: false
      selector:
        boolean:

    chlorine_sensor:
      name: Chlor-Konzentration Sensor (ppm)
      description: Sensor für den Chlor-Wert in ppm
      default: ""
      selector:
        entity:
          domain: sensor

    chlorine_target_min:
      name: Ziel-Chlor-Wert Minimum (ppm)
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.1
          unit_of_measurement: ppm

    chlorine_target_max:
      name: Ziel-Chlor-Wert Maximum (ppm)
      default: 3.0
      selector:
        number:
          min: 0.1
          max: 5
          step: 0.1
          unit_of_measurement: ppm

    chlorine_critical_low:
      name: Kritisch niedriger Chlor-Wert (ppm)
      description: Ab diesem Wert wird eine Benachrichtigung gesendet
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 2
          step: 0.1
          unit_of_measurement: ppm

    # ==== PH-SENSOREN ====
    ph_sensor_enabled:
      name: PH-Sensor aktivieren
      default: false
      selector:
        boolean:

    ph_sensor:
      name: PH-Wert Sensor
      description: Sensor für den PH-Wert
      default: ""
      selector:
        entity:
          domain: sensor

    ph_target_min:
      name: Ziel-PH-Wert Minimum
      default: 7.0
      selector:
        number:
          min: 6.0
          max: 8.0
          step: 0.1

    ph_target_max:
      name: Ziel-PH-Wert Maximum
      default: 7.6
      selector:
        number:
          min: 6.0
          max: 8.0
          step: 0.1

    # ==== POOLGRÖSSE ====
    pool_size_liters:
      name: Poolgröße (Liter)
      default: 50000
      selector:
        number:
          min: 1000
          max: 1000000
          unit_of_measurement: L

    # ==== MULTITAB-DOSIER ====
    multitab_dispenser:
      name: Multitab-Dosierer (optional)
      description: Input number Entity für Multitab-Öffnung (0-100%)
      default: ""
      selector:
        entity:
          domain: input_number

    # ==== BENACHRICHTIGUNGEN ====
    notification_service:
      name: Benachrichtigungs-Service
      description: "z.B. notify.mobile_app_phone"
      default: "notify.persistent_notification"
      selector:
        text:

variables:
  chlorine_enabled: !input chlorine_sensor_enabled
  chlorine_entity: !input chlorine_sensor
  chlorine_min: !input chlorine_target_min
  chlorine_max: !input chlorine_target_max
  chlorine_critical: !input chlorine_critical_low
  ph_enabled: !input ph_sensor_enabled
  ph_entity: !input ph_sensor
  ph_min: !input ph_target_min
  ph_max: !input ph_target_max
  pool_size: !input pool_size_liters
  multitab_entity: !input multitab_dispenser
  notify_service: !input notification_service

trigger:
  # Chlor-Sensor Änderung
  - platform: state
    entity_id: !input chlorine_sensor
    id: "chlorine_changed"

  # PH-Sensor Änderung
  - platform: state
    entity_id: !input ph_sensor
    id: "ph_changed"

  # Tägliche Kontrolle
  - platform: time
    at: "09:00:00"
    id: "daily_check"
  - platform: time
    at: "16:00:00"
    id: "daily_check"

condition: []

action:
  - choose:
      # Chlor-Überprüfung
      - conditions:
          - condition: trigger
            id: "chlorine_changed"
          - condition: template
            value_template: "{{ chlorine_enabled }}"
        sequence:
          - variables:
              current_chlorine: "{{ states(chlorine_entity) | float(0) }}"
              chlorine_need: >
                {% if current_chlorine < chlorine_critical %}
                  KRITISCH_LOW
                {% elif current_chlorine < chlorine_min %}
                  TOO_LOW
                {% elif current_chlorine > chlorine_max %}
                  TOO_HIGH
                {% else %}
                  OK
                {% endif %}
              # Berechnung: ml Chlor-Lösung pro 50m³ (50000L) für 1 ppm
              chlorine_increase_ml: >
                {% set deficit = chlorine_min - current_chlorine %}
                {% if deficit > 0 %}
                  {{ ((deficit * pool_size / 1000) * 100 / 50) | round(0) }}
                {% else %}
                  0
                {% endif %}
          - service: "{{ notify_service }}"
            data:
              title: "🏊 Pool-Chemie: Chlor-Wert"
              message: >
                Aktueller Chlor-Wert: {{ current_chlorine }} ppm

                {% if chlorine_need == 'KRITISCH_LOW' %}
                  🚨 KRITISCH NIEDRIG!
                  Empfehlung: Ca. {{ chlorine_increase_ml }} ml Chlor-Lösung zugeben
                  Multitab-Dosierer vollständig öffnen!
                {% elif chlorine_need == 'TOO_LOW' %}
                  ⚠️ ZU NIEDRIG
                  Empfehlung: Ca. {{ chlorine_increase_ml }} ml Chlor-Lösung zugeben
                {% elif chlorine_need == 'TOO_HIGH' %}
                  ℹ️ ZU HOCH
                  Wartet mit neuer Chlor-Zugabe, bis Wert sinkt
                {% else %}
                  ✅ OPTIMAL
                {% endif %}

                Zielbereich: {{ chlorine_min }}-{{ chlorine_max }} ppm

          # Zusätzliche Aktion bei kritisch niedrigem Wert
          - if:
              - condition: template
                value_template: "{{ chlorine_need == 'KRITISCH_LOW' }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ multitab_entity != '' }}"
                then:
                  - service: input_number.set_value
                    target:
                      entity_id: "{{ multitab_entity }}"
                    data:
                      value: 100

      # PH-Überprüfung
      - conditions:
          - condition: trigger
            id: "ph_changed"
          - condition: template
            value_template: "{{ ph_enabled }}"
        sequence:
          - variables:
              current_ph: "{{ states(ph_entity) | float(7.0) }}"
              ph_need: >
                {% if current_ph < ph_min %}
                  TOO_LOW
                {% elif current_ph > ph_max %}
                  TOO_HIGH
                {% else %}
                  OK
                {% endif %}
              # Berechnung: ml PH-Minus pro 50m³ für 0.1 Punkt Senkung
              ph_minus_ml: >
                {% set deficit = current_ph - ph_max %}
                {% if deficit > 0 %}
                  {{ ((deficit * pool_size / 1000) * 20) | round(0) }}
                {% else %}
                  0
                {% endif %}
          - service: "{{ notify_service }}"
            data:
              title: "🏊 Pool-Chemie: PH-Wert"
              message: >
                Aktueller PH-Wert: {{ current_ph }}

                {% if ph_need == 'TOO_LOW' %}
                  ℹ️ ZU NIEDRIG
                  Empfehlung: Ca. {{ ((ph_min - current_ph) * pool_size / 1000 * 20) | round(0) }} ml PH+ zugeben
                {% elif ph_need == 'TOO_HIGH' %}
                  ⚠️ ZU HOCH
                  Empfehlung: Ca. {{ ph_minus_ml }} ml PH- zugeben
                {% else %}
                  ✅ OPTIMAL
                {% endif %}

                Zielbereich: {{ ph_min }}-{{ ph_max }}

      # Tägliche Kontrolle
      - conditions:
          - condition: trigger
            id: "daily_check"
        sequence:
          - if:
              - condition: template
                value_template: "{{ chlorine_enabled and states(chlorine_entity) != 'unknown' }}"
            then:
              - variables:
                  current_chlorine: "{{ states(chlorine_entity) | float(0) }}"
              - if:
                  - condition: template
                    value_template: "{{ current_chlorine < chlorine_critical }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      title: "🚨 POOL-ALARM: Chlor kritisch!"
                      message: "Chlor-Wert: {{ current_chlorine }} ppm (kritisch). Sofort handeln!"

          - if:
              - condition: template
                value_template: "{{ ph_enabled and states(ph_entity) != 'unknown' }}"
            then:
              - variables:
                  current_ph: "{{ states(ph_entity) | float(7.0) }}"
              - if:
                  - condition: template
                    value_template: "{{ current_ph < 6.5 or current_ph > 8.0 }}"
                then:
                  - service: "{{ notify_service }}"
                    data:
                      title: "🚨 POOL-ALARM: PH kritisch!"
                      message: "PH-Wert: {{ current_ph }} (kritisch). Sofort handeln!"
